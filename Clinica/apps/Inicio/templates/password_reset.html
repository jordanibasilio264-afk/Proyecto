{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body>
    <div class="login-pagina">
        <div class="login-card">
            <img src="{% static 'images/logo-clinica.png' %}" alt="Clínica Médica General y Familiar" class="logo-img">
            <h1>Recuperar contraseña</h1>
            <p>Escribe tu correo y te enviaremos un enlace para cambiarla</p>

            <form method="post" novalidate>
                {% csrf_token %}
                {{ form.non_field_errors }}
                <div class="campo">
                    <label for="{{ form.email.id_for_label }}">Correo electrónico</label>
                    {{ form.email }}
                    {{ form.email.errors }}
                </div>
                <button type="submit" class="btn-login">Enviar enlace</button>
            </form>

            <a href="{% url 'login' %}" class="volver">← Volver a iniciar sesión</a>
        </div>
    </div>
</body>
</html>
