{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrarse</title>

    <link rel="stylesheet" href="{% static 'registro.css' %}">

</head>

<body>

    <div class="registro-pagina">

        <div class="registro-card">

            <img
                src="{% static 'images/logo-clinica.png' %}"
                alt="Clínica Médica General y Familiar"
                class="logo-img"
                style="display:block; height:90px; width:auto; max-width:100%; margin:0 auto 12px;"
            >

            <h1>
                Crear cuenta
            </h1>

            <p>
                Regístrate en nuestra clínica
            </p>


            <form method="POST">

                {% csrf_token %}


                <div class="campo">

                    <label>
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        name="nombre"
                        placeholder="Nombre completo"
                        required
                    >

                </div>


                <div class="campo">

                    <label>
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="correo@gmail.com"
                        required
                    >

                </div>


                <div class="campo">

                    <label>
                        Contraseña
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Contraseña"
                        required
                    >

                </div>


                <div class="campo">

                    <label>
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        name="password2"
                        placeholder="Repite la contraseña"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-registro"
                >
                    Registrarse
                </button>

            </form>


            <p class="login-texto">

                ¿Ya tienes una cuenta?

                <a href="{% url 'login' %}">
                    Iniciar sesión
                </a>

            </p>


            <a
                href="{% url 'inicio' %}"
                class="volver"
            >
                ← Volver al inicio
            </a>

        </div>

    </div>

</body>

</html>
