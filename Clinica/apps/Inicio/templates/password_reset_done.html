{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correo enviado</title>
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body>
    <div class="login-pagina">
        <div class="login-card">
            <img src="{% static 'images/logo-clinica.png' %}" alt="Clínica Médica General y Familiar" class="logo-img">
            <h1>Revisa tu correo</h1>
            <p>Si el correo está registrado, recibirás un enlace para cambiar tu contraseña. Revisa también la carpeta de spam.</p>
            <a href="{% url 'login' %}" class="volver">← Volver a iniciar sesión</a>
        </div>
    </div>
</body>
</html>
